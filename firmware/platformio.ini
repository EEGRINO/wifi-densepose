; RuView Ultimate — ESP32-S3
;
; По умолчанию: 8MB Flash, БЕЗ PSRAM (как большинство DevKitC-1 «N8»).
; Если у модуля реально N16R8 (16MB + OPI PSRAM) и прошивка с текущим env грузится —
; переключитесь на env: ruview-s3-n16r8 (см. README).

[platformio]
default_envs = ruview-s3-n8r2

; --- 8 MB Flash, без PSRAM (если в логе «Detected size(8192k)» и «PSRAM … failed») ---
[env:ruview-s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; На ESP32-S3 с USB-CDC линии DTR/RTS часто дёргают сброс; без этого монитор может «молчать»
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
board_build.partitions = partitions_ruview.csv
board_build.arduino.usb_mode = hardware

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

board_build.sdkconfig_defaults = sdkconfig.defaults

lib_deps =
  mathieucarbou/ESPAsyncWebServer@^3.4.5
  bblanchon/ArduinoJson@^7.2.0

; --- 16 MB Flash + 8 MB OPI PSRAM (маркировка модуля N16R8 и совместимая разводка) ---
[env:ruview-s3-n16r8]
extends = env:ruview-s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
  ${env:ruview-s3.build_flags}
  -DBOARD_HAS_PSRAM

; ESP32-S3 N8R2: 8 MB Flash + 2 MB Quad SPI PSRAM
[env:ruview-s3-n8r2]
extends = env:ruview-s3
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_flags =
  ${env:ruview-s3.build_flags}
  -DBOARD_HAS_PSRAM
